[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evm-reconstruction-lab"
version = "0.1.0"
description = "Reproducible EVM bytecode analysis, reconstruction, and validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "eth-utils==6.0.0", "eth-abi==6.0.0", "py-evm==0.12.1b1", "cbor2>=5.6,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
evm-lab = "evm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
